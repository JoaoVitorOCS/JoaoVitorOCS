name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *"   # ~03:17 em Brasília, todo dia
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_contributions.py
      - run: python scripts/render_heatmap_svg.py
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: atualiza gráfico de contribuições [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
